<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مديرية بلدية النخيب | Directorate of Al-Nukhaib Municipality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f7; --bg-alt:#e8edf1; --card:#ffffff; --text:#12261c; --muted:#64748b;
  --primary:#0d5c3d; --primary-2:#0a7a4f; --primary-dark:#073d28;
  --accent:#c9a227; --accent-2:#e7c65a; --border:#dbe4e9;
  --shadow:0 6px 24px rgba(9,44,30,.08); --shadow-lg:0 18px 50px rgba(9,44,30,.16);
  --radius:18px; --header-h:74px;
}
[data-theme="dark"]{
  --bg:#0b1220; --bg-alt:#111a2b; --card:#16213a; --text:#e7eef7; --muted:#9aa9c0;
  --primary:#1d8f63; --primary-2:#25b57e; --primary-dark:#0d3b28;
  --accent:#e2bd45; --accent-2:#f2d67a; --border:#26334f;
  --shadow:0 6px 24px rgba(0,0,0,.45); --shadow-lg:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.75;transition:background .3s,color .3s;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* FLOATING BUTTONS */
.float-btns{position:fixed;left:0;top:45%;transform:translateY(-50%);z-index:900;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.float-btns button{width:52px;height:52px;border-radius:0 14px 14px 0;background:var(--card);border:1px solid var(--border);border-left:none;box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.35rem;font-weight:700;transition:.25s;color:var(--text)}
.float-btns button:hover{background:var(--primary);color:#fff;width:60px}
.float-btns button.lang-btn{font-size:.95rem;letter-spacing:.5px}

/* HEADER */
header.site-header{position:sticky;top:0;z-index:800;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:0 2px 18px rgba(0,0,0,.06)}
.topbar{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#eaf6f0;font-size:.82rem;padding:6px 0}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topbar a{opacity:.9}
.topbar a:hover{opacity:1;text-decoration:underline}
.nav-wrap{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:var(--header-h)}
.logo-box{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.logo-mark{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 6px 18px rgba(13,92,61,.35);flex-shrink:0;overflow:hidden}
.logo-mark img{width:100%;height:100%;object-fit:cover}
.logo-txt b{display:block;font-size:1.02rem;line-height:1.25;color:var(--text)}
.logo-txt span{font-size:.72rem;color:var(--muted);letter-spacing:.3px}

/* NAV */
nav.main-nav{display:flex;align-items:center;gap:2px;flex:1;justify-content:center}
nav.main-nav > .nav-item{position:relative;display:flex;align-items:center;border-radius:10px;transition:.2s}
nav.main-nav > .nav-item > .nav-main-link{padding:10px 14px;font-size:.87rem;font-weight:600;color:var(--text);white-space:nowrap;border-radius:10px;transition:.2s;display:block}
nav.main-nav > .nav-item > .nav-caret{padding:10px 8px 10px 2px;font-size:.6rem;color:var(--muted);transition:.2s;border-radius:0 10px 10px 0}
nav.main-nav > .nav-item:hover > .nav-main-link,
nav.main-nav > .nav-item.active > .nav-main-link,
nav.main-nav > .nav-item:hover > .nav-caret,
nav.main-nav > .nav-item.active > .nav-caret{background:var(--primary);color:#fff}
.dropdown{position:absolute;top:calc(100% + 8px);inset-inline-start:0;min-width:250px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s;z-index:850;max-height:70vh;overflow:auto}
.nav-item:hover > .dropdown,
.nav-item.open > .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown a{display:block;padding:10px 14px;border-radius:9px;font-size:.85rem;font-weight:500;transition:.18s}
.dropdown a:hover{background:var(--primary);color:#fff;padding-inline-start:20px}
.burger{display:none;font-size:1.6rem;padding:6px 10px;border-radius:10px;background:var(--bg-alt)}

/* LAYOUT */
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.section{padding:56px 0}
.section-title{text-align:center;margin-bottom:38px}
.section-title h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;color:var(--text);display:inline-block;position:relative;padding-bottom:14px}
.section-title h2::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.section-title p{color:var(--muted);font-size:.92rem;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 8px 22px rgba(13,92,61,.28);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(13,92,61,.38)}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none}
.btn.ghost:hover{background:var(--primary);color:#fff}
.btn.small{padding:7px 16px;font-size:.8rem}
.btn.danger{background:linear-gradient(135deg,#b91c1c,#dc2626);box-shadow:0 8px 22px rgba(185,28,28,.3)}

/* HERO */
.hero{position:relative;min-height:clamp(360px,62vh,600px);background-size:cover;background-position:center;display:flex;align-items:center;clip-path:polygon(0 0,100% 0,100% 86%,78% 96%,56% 88%,33% 97%,12% 89%,0 93%);margin-bottom:-40px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(7,61,40,.88) 0%,rgba(7,61,40,.62) 45%,rgba(7,61,40,.25) 100%)}
.hero-inner{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:0 20px 60px;width:100%}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;padding:7px 18px;border-radius:99px;font-size:.8rem;font-weight:600;margin-bottom:18px;backdrop-filter:blur(6px)}
.hero h1{color:#fff;font-size:clamp(1.7rem,4.6vw,3.3rem);font-weight:900;line-height:1.25;max-width:760px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.hero p.sub{color:#d8ece2;font-size:clamp(.9rem,1.8vw,1.1rem);margin-top:14px;max-width:620px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero-actions .btn{box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hero-actions .btn.gold{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3a2c00}

/* STATS */
.stats-grid{position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:1180px;margin:0 auto;padding:0 20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 14px;text-align:center;box-shadow:var(--shadow);transition:.3s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.stat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.stat-ico{font-size:1.7rem;margin-bottom:6px}
.stat-num{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:900;color:var(--primary);line-height:1.1}
[data-theme="dark"] .stat-num{color:var(--primary-2)}
.stat-lbl{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:4px}

/* CARDS */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.news-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.3s;display:flex;flex-direction:column}
.news-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.news-thumb{height:190px;background:var(--bg-alt);overflow:hidden;position:relative}
.news-thumb img{width:100%;height:100%;object-fit:cover;transition:.5s}
.news-card:hover .news-thumb img{transform:scale(1.07)}
.news-thumb .ph{width:100%;height:100%;display:grid;place-items:center;font-size:2.6rem;opacity:.35;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.news-date{position:absolute;top:12px;inset-inline-end:12px;background:rgba(0,0,0,.65);color:#fff;padding:4px 12px;border-radius:99px;font-size:.72rem;font-weight:600;backdrop-filter:blur(4px)}
.news-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.news-body h3{font-size:1.02rem;font-weight:700;line-height:1.45}
.news-body p{font-size:.86rem;color:var(--muted);flex:1}
.more-link{color:var(--primary);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
[data-theme="dark"] .more-link{color:var(--primary-2)}
.more-link:hover{gap:12px;transition:.2s}

.dept-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);transition:.3s;border-inline-start:5px solid var(--primary);position:relative;scroll-margin-top:120px}
.dept-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.dept-card.highlight{border-color:var(--accent);box-shadow:0 0 0 4px rgba(201,162,39,.35),var(--shadow-lg);animation:pulseHi 1.6s ease 3}
@keyframes pulseHi{0%,100%{box-shadow:0 0 0 4px rgba(201,162,39,.35),var(--shadow-lg)}50%{box-shadow:0 0 0 10px rgba(201,162,39,.12),var(--shadow-lg)}}
.dept-card h3{font-size:1.08rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px;color:var(--primary)}
[data-theme="dark"] .dept-card h3{color:var(--primary-2)}
.dept-card .ico{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:1.15rem}
.dept-card p{font-size:.89rem;color:var(--muted);white-space:pre-line}

/* PAGE FOOTER BLOCK */
.page-footer-block{background:var(--bg-alt);border-top:1px solid var(--border);padding:52px 0 40px;margin-top:50px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:1280px;margin:0 auto;padding:0 20px}
.pf-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.pf-box h3{font-size:1.05rem;font-weight:800;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:9px;color:var(--primary)}
[data-theme="dark"] .pf-box h3{color:var(--primary-2)}
.map-frame{width:100%;height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--bg-alt)}
.map-frame iframe{width:100%;height:100%;border:0;display:block}
.contact-rows{display:flex;flex-direction:column;gap:14px}
.contact-row{display:flex;gap:12px;align-items:flex-start;font-size:.88rem}
.contact-row .ci{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:1rem}
.contact-row b{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.contact-row span{font-weight:600}

/* SOCIAL */
.social-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--border)}
.social-ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:var(--bg-alt);color:var(--text);border:1px solid var(--border);transition:.28s}
.social-ico:hover{transform:translateY(-5px) scale(1.06);color:#fff}
.social-ico.fb:hover{background:#1877f2;border-color:#1877f2}
.social-ico.wa:hover{background:#25d366;border-color:#25d366}
.social-ico.tt:hover{background:#000;border-color:#000}
.social-ico.yt:hover{background:#ff0000;border-color:#ff0000}

/* LINKS */
.links-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.link-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 14px;text-align:center;box-shadow:var(--shadow);transition:.3s;display:flex;flex-direction:column;align-items:center;gap:9px}
.link-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.link-card .li{font-size:1.6rem}
.link-card b{font-size:.83rem;font-weight:700;line-height:1.4}

/* PAGE HERO */
.page-hero{background:linear-gradient(120deg,var(--primary-dark),var(--primary) 60%,var(--primary-2));color:#fff;padding:52px 0 44px;position:relative;overflow:hidden}
.page-hero::after{content:'';position:absolute;inset-inline-end:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.06)}
.page-hero::before{content:'';position:absolute;inset-inline-start:-60px;bottom:-100px;width:260px;height:260px;border-radius:50%;background:rgba(201,162,39,.14)}
.page-hero .wrap{position:relative;z-index:2}
.page-hero h1{font-size:clamp(1.5rem,3.6vw,2.3rem);font-weight:900}
.breadcrumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;margin-top:10px;opacity:.9}
.breadcrumb a:hover{text-decoration:underline}

/* ARTICLE */
.article-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow)}
.article-box h2{font-size:1.5rem;font-weight:800;margin-bottom:8px;color:var(--primary)}
[data-theme="dark"] .article-box h2{color:var(--primary-2)}
.article-meta{font-size:.8rem;color:var(--muted);margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.article-body{font-size:.95rem;line-height:2;white-space:pre-line;color:var(--text)}
.article-img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:22px}

/* GALLERY CAROUSEL */
.gallery-carousel{position:relative;width:100%;height:clamp(280px,45vh,480px);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-alt)}
.gal-slide{position:absolute;inset:0;opacity:0;background-size:cover;background-position:center;transition:opacity .25s}
.gal-slide.active{opacity:1;z-index:2}
.gal-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.68) 0%,transparent 55%)}
.gal-caption{position:absolute;bottom:0;left:0;right:0;padding:22px;color:#fff;z-index:3;font-weight:700;font-size:clamp(.9rem,1.5vw,1.15rem);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--primary-dark);font-size:1.4rem;font-weight:900;display:grid;place-items:center;cursor:pointer;transition:.2s;font-family:monospace}
.gal-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.gal-nav.prev{right:16px}
.gal-nav.next{left:16px}
.gal-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.gal-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.2s;padding:0;border:none}
.gal-dot.active{background:#fff;width:26px;border-radius:5px}

@keyframes galFade{from{opacity:0}to{opacity:1}}
@keyframes galSlideLeft{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes galSlideRight{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes galSlideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes galSlideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes galZoomIn{from{transform:scale(1.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes galZoomOut{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes galRotate{from{transform:rotate(-15deg) scale(1.3);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
@keyframes galFlip{from{transform:perspective(800px) rotateY(90deg);opacity:0}to{transform:perspective(800px) rotateY(0);opacity:1}}
@keyframes galBlur{from{filter:blur(20px);opacity:0}to{filter:blur(0);opacity:1}}
@keyframes galDiagonal{from{transform:translate(-100%,100%);opacity:0}to{transform:translate(0,0);opacity:1}}
@keyframes galSwing{from{transform:rotate(8deg) scale(1.1);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.gal-slide.anim-fade.active{animation:galFade .9s ease}
.gal-slide.anim-slide-left.active{animation:galSlideLeft .9s ease}
.gal-slide.anim-slide-right.active{animation:galSlideRight .9s ease}
.gal-slide.anim-slide-up.active{animation:galSlideUp .9s ease}
.gal-slide.anim-slide-down.active{animation:galSlideDown .9s ease}
.gal-slide.anim-zoom-in.active{animation:galZoomIn .9s ease}
.gal-slide.anim-zoom-out.active{animation:galZoomOut .9s ease}
.gal-slide.anim-rotate.active{animation:galRotate .9s ease}
.gal-slide.anim-flip.active{animation:galFlip .9s ease}
.gal-slide.anim-blur.active{animation:galBlur .9s ease}
.gal-slide.anim-diagonal.active{animation:galDiagonal .9s ease}
.gal-slide.anim-swing.active{animation:galSwing .9s ease}

/* YOUTUBE */
.yt-wrap{max-width:900px;margin:0 auto}
.yt-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);background:#000}
.yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-placeholder{padding:60px 20px;text-align:center;color:var(--muted);background:var(--bg-alt);border-radius:18px;border:2px dashed var(--border);font-weight:600}

/* SERVICES */
.serv-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:.3s;cursor:pointer;text-align:center}
.serv-card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.serv-card .si{width:72px;height:72px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;font-size:2rem;box-shadow:0 10px 26px rgba(13,92,61,.3)}
.serv-card h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
.serv-card p{font-size:.85rem;color:var(--muted)}

/* TENDERS */
.tender-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);transition:.3s;display:flex;gap:20px;align-items:flex-start;border-inline-start:5px solid var(--accent)}
.tender-card:hover{transform:translateX(-4px);box-shadow:var(--shadow-lg)}
.tender-card .td{width:76px;height:76px;flex-shrink:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3a2c00;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.tender-card .td span:first-child{font-size:1.5rem;line-height:1}
.tender-card .td span:last-child{font-size:.66rem}
.tender-card h3{font-size:1.03rem;font-weight:800;margin-bottom:6px}
.tender-card p{font-size:.86rem;color:var(--muted);white-space:pre-line}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(4,20,14,.7);backdrop-filter:blur(6px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:22px;max-width:620px;width:100%;padding:32px;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:pop .3s ease;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:1.3rem;font-weight:800;margin-bottom:6px;text-align:center}
.modal .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:22px}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem;transition:.2s}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(13,92,61,.13)}
.fld textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}

.admin-panel{position:fixed;inset:0;background:var(--bg);z-index:3000;display:none;flex-direction:column}
.admin-panel.show{display:flex}
.admin-head{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);flex-wrap:wrap}

.admin-body{flex:1;overflow:auto;padding:24px}
.admin-inner{max-width:1100px;margin:0 auto}

.admin-portals{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.admin-portal{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow);color:var(--text)}
.admin-portal:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary);background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--primary) 6%,var(--card)))}

.ap-title{font-weight:800;font-size:.95rem;line-height:1.35}
.ap-desc{font-size:.72rem;color:var(--muted);line-height:1.5;display:none}

.admin-section-view h2{color:var(--primary);margin-bottom:10px}
[data-theme="dark"] .admin-section-view h2{color:var(--primary-2)}

/* ADMIN FORM ELEMENTS */
.adm-item{border:1px dashed var(--border);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--bg)}
.adm-item-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.88rem;margin-bottom:12px;color:var(--primary);gap:10px}
[data-theme="dark"] .adm-item-head{color:var(--primary-2)}

.adm-item-head button{background:#dc2626;color:#fff;border-radius:8px;padding:4px 12px;font-size:.75rem;font-weight:700;flex-shrink:0}
.adm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-hint{font-size:.8rem;color:var(--muted);margin-bottom:14px;line-height:1.6;padding:10px 14px;background:var(--bg-alt);border-radius:10px;border-inline-start:3px solid var(--primary)}
.file-input{margin-top:6px;font-size:.76rem}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#fff;padding:13px 28px;border-radius:14px;font-weight:700;font-size:.88rem;z-index:5000;box-shadow:0 12px 34px rgba(0,0,0,.3);transition:.4s}
.toast.show{transform:translateX(-50%) translateY(0)}

/* FOOTER */
footer.site-footer{background:linear-gradient(160deg,var(--primary-dark),#041f14);color:#cfe3d9;padding:44px 0 22px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px;max-width:1280px;margin:0 auto;padding:0 20px 30px}
.footer-grid h4{color:#fff;font-size:1rem;margin-bottom:14px;font-weight:800}
.footer-grid p,.footer-grid a{font-size:.84rem;line-height:2;opacity:.85}

.footer-bottom{text-align:center;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:.78rem;opacity:.7;max-width:1280px;margin:0 auto;padding-inline:20px}

/* RESPONSIVE */

}

     contentAr:"عقدت مديرية بلدية النخيب ورشة عمل متخصصة حول تبسيط إجراءات منح إجازة البناء وتقليل المدة الزمنية اللازمة لإنجاز المعاملة.\n\nحضر الورشة عدد من المهندسين والفنيين في شعبة تنظيم المدن وشعبة منح إجازة إشغال، وتم مناقشة آليات التحول الرقمي وأتمتة المعاملات.\n\nويهدف المشروع إلى تسهيل الإجراءات على المواطنين وتقليل المراجعات المتكررة.",
     contentEn:"Al-Nukhaib Municipality held a specialized workshop on simplifying building permit procedures and reducing the time required to complete transactions.\n\nThe workshop was attended by engineers and technicians from the Urban Organization Division and the Occupancy Permit Division, discussing digital transformation and transaction automation.\n\nThe project aims to facilitate procedures for citizens and reduce repeated visits.",
     date:"2024-10-28"},
    {id:UID(), image:"https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=900&q=80",
     titleAr:"المديرية تعلن عن مشروع إنارة الطرق الرئيسية",
     titleEn:"Directorate announces main roads lighting project",
     contentAr:"أعلنت مديرية بلدية النخيب عن المباشرة بمشروع إنارة الطرق الرئيسية والدوارات في مركز الناحية باستخدام أعمدة إنارة حديثة موفرة للطاقة.\n\nيهدف المشروع إلى تحسين الرؤية الليلية وتعزيز السلامة المرورية، إضافة إلى إضفاء مظهر جمالي على شوارع المدينة.\n\nومن المؤمل إنجاز المشروع خلال المدة المحددة في العقد.",
     contentEn:"Al-Nukhaib Municipality announced the start of a project to light main roads and roundabouts in the district center using modern energy-saving lighting poles.\n\nThe project aims to improve night visibility and enhance traffic safety, in addition to giving the city streets a beautiful appearance.\n\nThe project is expected to be completed within the period specified in the contract.",
     date:"2024-10-15"},
    {id:UID(), image:"https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=900&q=80",
     titleAr:"إزالة التجاوزات على الأملاك العامة في النخيب",
     titleEn:"Removing violations on public properties in Al-Nukhaib",
     contentAr:"نفذت شعبة الأملاك بالتعاون مع القسم البلدي حملة لإزالة التجاوزات الحاصلة على الأملاك العامة والأرصفة في عدد من شوارع مركز الناحية.\n\nوتم إنذار المخالفين مسبقاً وفق القانون، ومنحهم المدة القانونية لإزالة التجاوزات قبل اتخاذ الإجراءات القانونية.\n\nوتؤكد المديرية استمرار الحملات حفاظاً على المال العام وتنظيم الشارع العراقي.",
     contentEn:"The Properties Division, in cooperation with the Municipal Department, carried out a campaign to remove violations on public properties and sidewalks in several streets of the district center.\n\nViolators were previously warned in accordance with the law and given the legal period to remove the violations before legal measures were taken.\n\nThe Directorate confirms the continuation of campaigns to preserve public funds and organize the street.",
     date:"2024-09-30"},

     titleEn:"Coordination meeting with Anbar Governorate Diwan",
     contentAr:"عقد مدير بلدية النخيب اجتماعاً تنسيقياً مع ممثلي ديوان محافظة الأنبار لمناقشة آليات تطوير الخدمات البلدية في الناحية وسبل تسريع إنجاز المشاريع.\n\nتم خلال الاجتماع استعراض الخطط المستقبلية للمديرية ومناقشة التحديات التي تواجه سير العمل وسبل معالجتها.\n\nوأكد الجانبان على أهمية التنسيق المشترك لخدمة المواطنين.",

     stepsAr:"1. مراجعة شعبة تنظيم المدن في مديرية البلدية.\n2. تقديم سند العقار (الطابو) + هوية الأحوال المدنية.\n3. تقديم مخطط هندسي مصادق من مهندس نقابة.\n4. تعبئة استمارة طلب إجازة البناء.\n5. الكشف الميداني من قبل الكادر الهندسي.\n6. تسديد الرسوم المقررة قانونياً.\n7. استلام الإجازة بعد المصادقة.",

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function deepMerge(base, over){
  for(const k in over){
    if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k]) && base[k] && typeof base[k]==='object'){
      deepMerge(base[k], over[k]);
    } else { base[k] = over[k]; }
  }
  return base;
}

function initGallery(){
  stopGalleryTimer();
  const wrap = document.getElementById('galleryCarousel');
  if(!wrap) return;
  const imgs = data.gallery || [];
  if(!imgs.length){
    wrap.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:var(--muted)">${esc(t('noContent'))}</div>`;
    return;
  }
  let html = imgs.map((g,i)=>`
    <div class="gal-slide${i===0?' active':''}" style="background-image:url('${esc(g.image)}')">
      ${(g.captionAr||g.captionEn) ? `<div class="gal-caption">${esc(L(g.captionAr,g.captionEn))}</div>` : ''}
    </div>`).join('');
  html += `<button class="gal-nav prev" type="button" onclick="galNav(-1)">‹</button>`;
  html += `<button class="gal-nav next" type="button" onclick="galNav(1)">›</button>`;
  html += `<div class="gal-dots">${imgs.map((_,i)=>`<button class="gal-dot${i===0?' active':''}" type="button" onclick="galGo(${i})"></button>`).join('')}</div>`;
  wrap.innerHTML = html;
  galleryCur = 0; galleryAnimIdx = 0;
  startGalleryTimer();
}
function startGalleryTimer(){
  stopGalleryTimer();
  galleryTimer = setInterval(()=>galNav(1), 2500);
}
function stopGalleryTimer(){
  if(galleryTimer) clearInterval(galleryTimer);
  galleryTimer = null;
}
window.galNav = function(dir){
  const total = (data.gallery||[]).length;
  if(!total) return;
  galleryCur = (galleryCur + dir + total) % total;
  galleryAnimIdx = (galleryAnimIdx + 1) % GALLERY_ANIMS.length;
  galShow(galleryCur, GALLERY_ANIMS[galleryAnimIdx]);
  startGalleryTimer();
};
window.galGo = function(idx){
  galleryCur = idx;
  galleryAnimIdx = (galleryAnimIdx + 1) % GALLERY_ANIMS.length;
  galShow(idx, GALLERY_ANIMS[galleryAnimIdx]);
  startGalleryTimer();
};
function galShow(idx, animClass){
  const wrap = document.getElementById('galleryCarousel');
  if(!wrap) return;
  const slides = wrap.querySelectorAll('.gal-slide');
  const dots = wrap.querySelectorAll('.gal-dot');
  slides.forEach(s=>{ s.className = 'gal-slide'; });
  void wrap.offsetWidth;
  if(slides[idx]) slides[idx].className = 'gal-slide active ' + animClass;
  dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
}

}

function truncate(s, n){ s = String(s||'').replace(/\s+/g,' '); return s.length>n ? s.slice(0,n).trim()+'…' : s; }
function formatDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(lang==='en'?'en-GB':'ar-EG',{year:'numeric',month:'short',day:'numeric'});
}
function animateCounters(){
  document.querySelectorAll('.stat-num[data-count]').forEach(el=>{
    const target = +el.dataset.count || 0;
    let cur = 0;
    const step = Math.max(1, Math.ceil(target/45));
    const iv = setInterval(()=>{
      cur += step;
      if(cur >= target){ cur = target; clearInterval(iv); }
      el.textContent = cur.toLocaleString(lang==='en'?'en-US':'ar-EG');
    }, 22);
  });
}

function router(){

  const raw = location.hash.slice(2) || '';
  const parts = raw.split('/');
  const route = parts[0] || '';
  const param = parts[1] || '';

  renderHeader();

  switch(route){
    case '': renderHome(); break;
    case 'about': renderAbout(param); break;
    case 'news': param ? renderNewsDetail(param) : renderNews(); break;
    case 'admin-depts': renderDepts('adminDepts', param); break;
    case 'tech-depts': renderDepts('techDepts', param); break;
    case 'muni-depts': renderDepts('muniDepts', param); break;
    case 'tenders': renderTenders(); break;
    case 'services': renderServices(param); break;
    case 'contact': renderContact(); break;
    default: renderHome();
  }
  window.scrollTo({top:0, behavior:'instant'});
  renderFooter();
}

/* PATH HELPERS */
function getPath(obj, path){ return path.split('.').reduce((o,k)=> o==null?undefined:o[k], obj); }
function setPath(path, val){
  const parts = path.split('.');
  let o = draft;
  for(let i=0;i<parts.length-1;i++){ o = o[parts[i]]; if(o==null) return; }
  o[parts[parts.length-1]] = val;
}
window.setPath = setPath;

function fileToData(input, path){
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.size > 3*1024*1024){
    toast(lang==='en'?'⚠️ Image too large (max 3MB)':'⚠️ حجم الصورة كبير جداً (الحد 3 ميجا)');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev=>{
    setPath(path, ev.target.result);
    const txt = document.querySelector(`input[data-path="${path}"]`);
    if(txt) txt.value = ev.target.result;
    toast(lang==='en'?'✔ Image uploaded':'✔ تم رفع الصورة');
  };
  reader.readAsDataURL(f);
}
window.fileToData = fileToData;

/* FORM BUILDERS */
function fld(label, path, value, opts={}){
  const type = opts.type || 'text';
  if(type === 'textarea'){
    return `<label class="fld"><span>${esc(label)}</span>
      <textarea data-path="${path}" rows="${opts.rows||4}" oninput="setPath(this.dataset.path,this.value)">${esc(value||'')}</textarea></label>`;
  }
  return `<label class="fld"><span>${esc(label)}</span>
    <input type="${type}" data-path="${path}" value="${esc(value||'')}" oninput="setPath(this.dataset.path,this.value)"></label>`;
}
function imgFld(label, path, value){
  return `<label class="fld"><span>${esc(label)}</span>
    <input type="text" data-path="${path}" value="${esc(value||'')}" oninput="setPath(this.dataset.path,this.value)" placeholder="https://...">
    <input class="file-input" type="file" accept="image/*" onchange="fileToData(this,'${path}')">
  </label>`;
}
function itemEditor(arrPath, i, item, fields, titleField){
  return `<div class="adm-item">
    <div class="adm-item-head">
      <span>${esc(item[titleField] || ('#'+(i+1)))}</span>
      <button onclick="delItem('${arrPath}',${i})">🗑</button>
    </div>
    ${fields.map(f=>{
      if(f.type==='image') return imgFld(f.label, `${arrPath}.${i}.${f.key}`, item[f.key]);
      return fld(f.label, `${arrPath}.${i}.${f.key}`, item[f.key], f);
    }).join('')}
  </div>`;
}
window.delItem = function(arrPath, i){
  const arr = getPath(draft, arrPath);
  if(!arr) return;

  document.getElementById('adminPortalsWrap').style.display = 'none';
  document.getElementById('adminSectionView').style.display = 'block';
  document.getElementById('adminSectionContent').innerHTML = ADMIN_SECTIONS[key]();
  document.getElementById('adminSectionView').scrollTop = 0;
};
window.backToAdminPortals = function(){
  currentAdminSection = null;
  document.getElementById('adminPortalsWrap').style.display = 'block';
  document.getElementById('adminSectionView').style.display = 'none';
};
